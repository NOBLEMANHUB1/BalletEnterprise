<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account — Ballet Enterprise</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body class="auth-body">
    <header class="auth-header">
      <a href="index.html" class="brand"> Ballet <span>Enterprise</span> </a>

      <ul class="auth-nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </header>

    <main class="auth-page">
      <div class="auth-card">
        <h2>Create Account</h2>

        <p class="auth-sub">
          Join Ballet Enterprise and start shopping smart today.
        </p>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="fullName"> Full name </label>

            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="contactType"> Register with </label>

            <select id="contactType" name="contactType" required>
              <option value="">Select option</option>

              <option value="email">Email address</option>

              <option value="phone">Phone number</option>
            </select>
          </div>

          <div class="form-group">
            <label for="contact" id="contactLabel"> Email address </label>

            <input
              type="email"
              id="contact"
              name="contact"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />

            <small class="field-hint">
              Must include letters, numbers and symbols.
            </small>
          </div>

          <div class="form-group">
            <label for="confirmPassword"> Confirm password </label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              required
            />
          </div>

          <p class="form-error" id="formError"></p>

          <button type="submit" class="auth-btn">Create account</button>
        </form>

        <p class="auth-footer">
          Already have an account?

          <a href="signin.html" class="auth-link"> Sign in </a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-bottom">
        <p>&copy; 2026 Ballet Enterprise. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/api-config.js"></script>
    <script src="js/session.js"></script>

    <script>
      const contactType = document.getElementById("contactType");
      const contactInput = document.getElementById("contact");
      const contactLabel = document.getElementById("contactLabel");

      contactType.addEventListener("change", () => {
        if (contactType.value === "phone") {
          contactInput.type = "tel";

          contactInput.placeholder = "Enter phone number";

          contactLabel.textContent = "Phone number";
        } else {
          contactInput.type = "email";

          contactInput.placeholder = "Enter email address";

          contactLabel.textContent = "Email address";
        }
      });
    </script>

    <script src="js/auth.js"></script>
  </body>
</html>
